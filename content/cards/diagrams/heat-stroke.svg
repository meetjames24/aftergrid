<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Heat stroke: cool them now</text><circle cx="250" cy="120" r="34" fill="#3A444C"/><rect x="198" y="164" width="104" height="170" rx="26" fill="#3A444C"/><path d="M192,182 L146,320" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M308,182 L354,320" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M224,332 L214,480" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M276,332 L286,480" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><circle cx="250" cy="162" r="18" fill="#2F7FC1"/><circle cx="188" cy="196" r="18" fill="#2F7FC1"/><circle cx="312" cy="196" r="18" fill="#2F7FC1"/><circle cx="228" cy="334" r="18" fill="#2F7FC1"/><circle cx="272" cy="334" r="18" fill="#2F7FC1"/><text x="460" y="150" font-size="26" font-weight="700" fill="#1F1E1C" text-anchor="start">Best: cold water up to the neck</text><path d="M460,186 q14,-14 29,0 t29,0" fill="none" stroke="#2F7FC1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M518,186 q14,-14 29,0 t29,0" fill="none" stroke="#2F7FC1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M576,186 q14,-14 29,0 t29,0" fill="none" stroke="#2F7FC1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M634,186 q14,-14 29,0 t29,0" fill="none" stroke="#2F7FC1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M692,186 q14,-14 29,0 t29,0" fill="none" stroke="#2F7FC1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="460" y="260" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Otherwise: soak with water and fan.</text><text x="460" y="300" font-size="24" font-weight="800" fill="#2F7FC1" text-anchor="start">Cold packs on the neck,</text><text x="460" y="329" font-size="24" font-weight="800" fill="#2F7FC1" text-anchor="start">armpits and groin.</text><text x="460" y="400" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">Keep cooling until they think</text><text x="460" y="427" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">clearly again. Then get help.</text><text x="460" y="470" font-size="22" font-weight="800" fill="#C2402C" text-anchor="start">No drinks if confused.</text></svg>