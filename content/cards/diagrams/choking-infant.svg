<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Choking (baby under 1)</text><line x1="450" y1="40" x2="450" y2="520" stroke="#E6E2D7" stroke-width="3" stroke-dasharray="6 10"/><path d="M90,270 L330,350" fill="none" stroke="#E0861A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M330,350 L352,352" fill="none" stroke="#E0861A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,272 L300,312" fill="none" stroke="#3A444C" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="336" cy="322" r="22" fill="#3A444C"/><path d="M180,280 L150,318" fill="none" stroke="#3A444C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><path d="M200,286 L190,330" fill="none" stroke="#3A444C" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><line x1="250" y1="200" x2="250" y2="248" stroke="#C2402C" stroke-width="8" stroke-linecap="round"/><path d="M250,270 L263,248 L237,248 Z" fill="#C2402C"/><rect x="216" y="176" width="70" height="22" rx="8" fill="#E0861A"/><circle cx="80" cy="120" r="22" fill="#E0861A"/><text x="80" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="116" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">5 back blows</text><text x="80" y="420" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Face down along your arm,</text><text x="80" y="447" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">head lower than the body.</text><text x="80" y="474" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Support the jaw, not the throat.</text><path d="M520,270 L760,350" fill="none" stroke="#E0861A" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><path d="M760,350 L782,352" fill="none" stroke="#E0861A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M600,258 L730,298" fill="none" stroke="#3A444C" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/><circle cx="766" cy="310" r="22" fill="#3A444C"/><path d="M664,256 L676,214" fill="none" stroke="#E0861A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M680,262 L692,220" fill="none" stroke="#E0861A" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><line x1="720" y1="170" x2="700" y2="207" stroke="#C2402C" stroke-width="8" stroke-linecap="round"/><path d="M690,226 L712,213 L689,200 Z" fill="#C2402C"/><circle cx="490" cy="120" r="22" fill="#E0861A"/><text x="490" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="526" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">5 chest thrusts</text><text x="490" y="420" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Face up, head lower.</text><text x="490" y="447" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Two fingers, centre of the chest,</text><text x="490" y="474" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">4 cm (1.5 in) deep.</text><text x="450" y="530" font-size="22" font-weight="700" fill="#1F1E1C" text-anchor="middle">Alternate 5 and 5. No abdominal thrusts on a baby.</text></svg>