<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Hypothermia: warm the core first</text><circle cx="250" cy="120" r="34" fill="#3A444C"/><rect x="198" y="164" width="104" height="170" rx="26" fill="#3A444C"/><path d="M192,182 L146,320" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M308,182 L354,320" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M224,332 L214,480" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M276,332 L286,480" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><rect x="198" y="164" width="104" height="170" rx="26" fill="#E0861A" opacity=".85"/><circle cx="250" cy="150" r="18" fill="#C2402C"/><circle cx="188" cy="196" r="18" fill="#C2402C"/><circle cx="312" cy="196" r="18" fill="#C2402C"/><circle cx="250" cy="334" r="18" fill="#C2402C"/><text x="460" y="140" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Out of the wind and wet.</text><text x="460" y="180" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">Dry clothes, insulate from</text><text x="460" y="207" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">the ground, cover the head.</text><text x="460" y="280" font-size="24" font-weight="800" fill="#E0861A" text-anchor="start">Warm chest, neck, armpits</text><text x="460" y="309" font-size="24" font-weight="800" fill="#E0861A" text-anchor="start">and groin first.</text><text x="460" y="350" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">Blankets, skin-to-skin,</text><text x="460" y="377" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">warm (not hot) packs.</text><path d="M452,434 L488,470" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M452,470 L488,434" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="462" font-size="22" font-weight="800" fill="#C2402C" text-anchor="start">Don't rub arms and legs.</text><path d="M452,494 L488,530" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M452,530 L488,494" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="500" y="522" font-size="22" font-weight="800" fill="#C2402C" text-anchor="start">No alcohol.</text></svg>