<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Stop the bleeding: press, pack</text><line x1="450" y1="40" x2="450" y2="520" stroke="#E6E2D7" stroke-width="3" stroke-dasharray="6 10"/><path d="M60,360 L400,360" fill="none" stroke="#3A444C" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="296" width="120" height="30" rx="8" fill="#F5F1E8" stroke="#6E6A60" stroke-width="4"/><path d="M230,296 L230,200" fill="none" stroke="#E0861A" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><rect x="186" y="270" width="88" height="34" rx="12" fill="#E0861A"/><path d="M260,296 L290,190" fill="none" stroke="#E0861A" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><rect x="214" y="250" width="80" height="26" rx="10" fill="#E0861A"/><line x1="330" y1="190" x2="330" y2="264" stroke="#C2402C" stroke-width="8" stroke-linecap="round"/><path d="M330,286 L343,264 L317,264 Z" fill="#C2402C"/><circle cx="80" cy="120" r="22" fill="#E0861A"/><text x="80" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="116" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">Press hard</text><text x="60" y="450" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Cloth or gauze on the wound,</text><text x="60" y="477" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">both hands, body weight.</text><text x="60" y="504" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Don't lift to look.</text><path d="M490,360 L830,360" fill="none" stroke="#3A444C" stroke-width="90" stroke-linecap="round" stroke-linejoin="round"/><path d="M640,316 q20,-4 40,0 l-6,40 q-14,6 -28,0 z" fill="#C2402C" stroke="#C2402C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M660,330 q-30,-60 -60,-110 q-20,-30 -60,-30" fill="none" stroke="#F5F1E8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M660,330 q-30,-60 -60,-110 q-20,-30 -60,-30" fill="none" stroke="#6E6A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M690,210 L668,320" fill="none" stroke="#E0861A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M716,214 L690,318" fill="none" stroke="#E0861A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="490" cy="120" r="22" fill="#E0861A"/><text x="490" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="526" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">Pack deep wounds</text><text x="490" y="450" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Push gauze or cloth into the wound</text><text x="490" y="477" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">(arm, leg, armpit, groin, neck),</text><text x="490" y="504" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">then press hard on top.</text></svg>