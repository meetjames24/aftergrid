<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="72" font-size="34" font-weight="800" fill="#1F1E1C" text-anchor="start">Recovery position</text><circle cx="216" cy="270" r="36" fill="#3A444C"/><path d="M260,274 L470,278" fill="none" stroke="#3A444C" stroke-width="60" stroke-linecap="round" stroke-linejoin="round"/><path d="M280,252 L320,160 L400,140" fill="none" stroke="#3A444C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M290,298 L234,356 L184,310" fill="none" stroke="#3A444C" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,278 L710,278" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,290 L580,400 L700,390" fill="none" stroke="#3A444C" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="440" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Head tilted back:</text><text x="60" y="469" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">airway open</text><line x1="130" y1="400" x2="186" y2="315" stroke="#E0861A" stroke-width="6" stroke-linecap="round"/><path d="M196,300 L177,309 L195,321 Z" fill="#E0861A"/><text x="290" y="440" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Hand under cheek</text><line x1="300" y1="410" x2="235" y2="363" stroke="#E0861A" stroke-width="6" stroke-linecap="round"/><path d="M220,352 L228,371 L241,354 Z" fill="#E0861A"/><text x="520" y="470" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Top knee bent:</text><text x="520" y="499" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">stops them rolling</text><line x1="590" y1="436" x2="588" y2="429" stroke="#E0861A" stroke-width="6" stroke-linecap="round"/><path d="M584,412 L578,432 L599,427 Z" fill="#E0861A"/><text x="620" y="92" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Use when someone is</text><text x="620" y="119" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">breathing but not awake.</text><text x="620" y="160" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Check breathing</text><text x="620" y="187" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">every minute.</text></svg>