<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Choking (adult or child over 1)</text><line x1="40" y1="480" x2="860" y2="480" stroke="#E6E2D7" stroke-width="4"/><line x1="450" y1="40" x2="450" y2="520" stroke="#E6E2D7" stroke-width="3" stroke-dasharray="6 10"/><path d="M156,480 L170,360 L188,480" fill="none" stroke="#E0861A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M170,360 L194,250" fill="none" stroke="#E0861A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><circle cx="208" cy="198" r="34" fill="#E0861A"/><path d="M194,250 L250,300 L330,296" fill="none" stroke="#E0861A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><path d="M286,480 L300,360 L318,480" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M300,360 L370,250" fill="none" stroke="#3A444C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><circle cx="396" cy="198" r="34" fill="#3A444C"/><path d="M370,250 L390,320" fill="none" stroke="#3A444C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M200,276 L300,330 L390,300" fill="none" stroke="#E0861A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/><line x1="300" y1="230" x2="325" y2="264" stroke="#C2402C" stroke-width="8" stroke-linecap="round"/><path d="M338,282 L336,256 L314,272 Z" fill="#C2402C"/><circle cx="70" cy="120" r="22" fill="#E0861A"/><text x="70" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="106" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">5 back blows</text><text x="225" y="510" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">Heel of the hand,</text><text x="225" y="534" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">between the shoulder blades</text><path d="M601,480 L615,360 L633,480" fill="none" stroke="#E0861A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M615,360 L625,250" fill="none" stroke="#E0861A" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><circle cx="636" cy="198" r="34" fill="#E0861A"/><path d="M686,480 L700,360 L718,480" fill="none" stroke="#3A444C" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/><path d="M700,360 L706,250" fill="none" stroke="#3A444C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><circle cx="716" cy="198" r="34" fill="#3A444C"/><path d="M706,250 L724,340" fill="none" stroke="#3A444C" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/><path d="M629,266 L680,330 L728,322" fill="none" stroke="#E0861A" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/><circle cx="736" cy="320" r="15" fill="#E0861A"/><line x1="800" y1="360" x2="775" y2="334" stroke="#C2402C" stroke-width="8" stroke-linecap="round"/><path d="M760,318 L766,343 L785,325 Z" fill="#C2402C"/><circle cx="480" cy="120" r="22" fill="#E0861A"/><text x="480" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="516" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">5 abdominal thrusts</text><text x="675" y="510" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">Fist just above the navel,</text><text x="675" y="534" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">pull sharply in and up</text><text x="860" y="66" font-size="22" font-weight="800" fill="#C2402C" text-anchor="end">Alternate 5 and 5</text></svg>