<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Tourniquet: where it goes</text><path d="M90,270 L470,276" fill="none" stroke="#3A444C" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/><path d="M470,276 L780,300" fill="none" stroke="#3A444C" stroke-width="74" stroke-linecap="round" stroke-linejoin="round"/><path d="M780,300 L820,260" fill="none" stroke="#3A444C" stroke-width="56" stroke-linecap="round" stroke-linejoin="round"/><circle cx="470" cy="276" r="52" fill="#3A444C"/><ellipse cx="660" cy="292" rx="26" ry="30" fill="#C2402C"/><path d="M650,320 q-6,40 4,70" fill="none" stroke="#C2402C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="560" y="226" width="36" height="128" rx="10" fill="#E0861A"/><rect x="452" y="210" width="36" height="140" rx="10" fill="none" stroke="#E0861A" stroke-width="6" stroke-dasharray="8 8"/><path d="M448,138 L492,182" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><path d="M448,182 L492,138" fill="none" stroke="#C2402C" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="470" y="124" font-size="22" font-weight="800" fill="#C2402C" text-anchor="middle">Not on a joint</text><path d="M578,380 L578,402 L660,402 L660,380" fill="none" stroke="#1F1E1C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="619" y="436" font-size="22" font-weight="800" fill="#1F1E1C" text-anchor="middle">5–7 cm (2–3 in)</text><text x="619" y="463" font-size="22" font-weight="800" fill="#1F1E1C" text-anchor="middle">above the wound</text><text x="90" y="400" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">Towards the heart ←</text><text x="50" y="486" font-size="24" font-weight="800" fill="#1F1E1C" text-anchor="start">Tighten until the bleeding stops. It will hurt.</text><text x="50" y="522" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">Write the time on it. Don't loosen it. Get to a hospital.</text><circle cx="820" cy="120" r="40" fill="none" stroke="#3A444C" stroke-width="8"/><path d="M820,120 L820,94" fill="none" stroke="#3A444C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M820,120 L840,132" fill="none" stroke="#3A444C" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="820" y="196" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">note the</text><text x="820" y="220" font-size="20" font-weight="700" fill="#6E6A60" text-anchor="middle">time</text></svg>