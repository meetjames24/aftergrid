<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">No tourniquet? Make one</text><circle cx="70" cy="120" r="22" fill="#E0861A"/><text x="70" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="150" cy="250" r="62" fill="#3A444C"/><circle cx="150" cy="250" r="70" fill="none" stroke="#E0861A" stroke-width="16"/><text x="150" y="380" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">Wrap a strip of strong,</text><text x="150" y="404" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">non-stretchy cloth,</text><text x="150" y="429" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">4 cm (1.5 in) or wider</text><circle cx="275" cy="120" r="22" fill="#E0861A"/><text x="275" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="355" cy="250" r="62" fill="#3A444C"/><circle cx="355" cy="250" r="70" fill="none" stroke="#E0861A" stroke-width="16"/><circle cx="355" cy="174" r="12" fill="#E0861A"/><path d="M295,164 L415,164" fill="none" stroke="#8A6A2C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><text x="355" y="380" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">Tie a knot over a</text><text x="355" y="404" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">stick, pen or spoon</text><circle cx="480" cy="120" r="22" fill="#E0861A"/><text x="480" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><circle cx="560" cy="250" r="62" fill="#3A444C"/><circle cx="560" cy="250" r="66" fill="none" stroke="#E0861A" stroke-width="16"/><circle cx="560" cy="174" r="12" fill="#E0861A"/><path d="M516,122 L604,206" fill="none" stroke="#8A6A2C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M630,130 a36,36 0 1 1 -12,-30" fill="none" stroke="#C2402C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M612,92 l14,6 l-10,12 z" fill="#C2402C"/><text x="560" y="380" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">Twist the stick until</text><text x="560" y="404" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">the bleeding stops</text><circle cx="685" cy="120" r="22" fill="#E0861A"/><text x="685" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><circle cx="765" cy="250" r="62" fill="#3A444C"/><circle cx="765" cy="250" r="66" fill="none" stroke="#E0861A" stroke-width="16"/><circle cx="765" cy="174" r="12" fill="#E0861A"/><path d="M721,122 L809,206" fill="none" stroke="#8A6A2C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M809,206 L835,248" fill="none" stroke="#E0861A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="765" y="380" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">Tie the stick down</text><text x="765" y="404" font-size="20" font-weight="700" fill="#1F1E1C" text-anchor="middle">so it can't unwind</text><text x="450" y="520" font-size="22" font-weight="800" fill="#C2402C" text-anchor="middle">Never use wire, cord, string or anything elastic.</text></svg>