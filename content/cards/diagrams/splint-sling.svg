<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="66" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Splint and sling</text><line x1="450" y1="40" x2="450" y2="520" stroke="#E6E2D7" stroke-width="3" stroke-dasharray="6 10"/><rect x="70" y="270" width="340" height="40" rx="8" fill="#C9A66B"/><path d="M90,250 L360,250" fill="none" stroke="#3A444C" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M360,250 L400,240" fill="none" stroke="#3A444C" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/><path d="M230,226 l10,22 l-12,10 l10,22" fill="none" stroke="#C2402C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="118" y="216" width="24" height="104" rx="6" fill="#E0861A"/><rect x="318" y="216" width="24" height="104" rx="6" fill="#E0861A"/><circle cx="80" cy="120" r="22" fill="#E0861A"/><text x="80" y="129" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="116" y="130" font-size="28" font-weight="700" fill="#1F1E1C" text-anchor="start">Splint</text><text x="60" y="380" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">Pad it. Tie it above and below</text><text x="60" y="407" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">the break so the joints either</text><text x="60" y="434" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">side can't move. Keep it as found.</text><circle cx="680" cy="150" r="32" fill="#3A444C"/><rect x="632" y="190" width="96" height="150" rx="24" fill="#3A444C"/><path d="M646,340 L640,470" fill="none" stroke="#3A444C" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/><path d="M714,340 L720,470" fill="none" stroke="#3A444C" stroke-width="26" stroke-