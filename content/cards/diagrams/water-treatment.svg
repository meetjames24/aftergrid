<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Inter, 'Noto Sans', 'DejaVu Sans', sans-serif"><rect x="1" y="1" width="898" height="558" rx="18" fill="#FFFFFF" stroke="#E6E2D7" stroke-width="2"/><text x="50" y="72" font-size="36" font-weight="800" fill="#1F1E1C" text-anchor="start">Making water safe</text><circle cx="80" cy="140" r="22" fill="#E0861A"/><text x="80" y="149" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><text x="118" y="150" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Boil</text><rect x="60" y="220" width="170" height="100" rx="14" fill="none" stroke="#3A444C" stroke-width="12"/><path d="M40,226 L250,226" fill="none" stroke="#3A444C" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M100,206 q-10,-14 0,-26 q10,-12 0,-24" fill="none" stroke="#6E6A60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M145,206 q-10,-14 0,-26 q10,-12 0,-24" fill="none" stroke="#6E6A60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M190,206 q-10,-14 0,-26 q10,-12 0,-24" fill="none" stroke="#6E6A60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="366" font-size="26" font-weight="700" fill="#1F1E1C" text-anchor="start">Rolling boil</text><text x="60" y="408" font-size="40" font-weight="800" fill="#C2402C" text-anchor="start">1 minute</text><text x="60" y="446" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">3 min above 2,000 m</text><text x="60" y="473" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">(6,500 ft)</text><line x1="300" y1="40" x2="300" y2="520" stroke="#E6E2D7" stroke-width="3" stroke-dasharray="6 10"/><circle cx="340" cy="140" r="22" fill="#E0861A"/><text x="340" y="149" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><text x="378" y="150" font-size="32" font-weight="800" fill="#1F1E1C" text-anchor="start">Plain bleach</text><text x="380" y="184" font-size="22" font-weight="600" fill="#6E6A60" text-anchor="start">unscented, 6% or 8.25%</text><text x="340" y="236" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start"></text><text x="560" y="236" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">1 litre</text><text x="680" y="236" font-size="22" font-weight="700" fill="#6E6A60" text-anchor="start">4 litres</text><text x="340" y="286" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Clear water</text><text x="560" y="286" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">2 drops</text><text x="680" y="286" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">8 drops</text><line x1="340" y1="302" x2="790" y2="302" stroke="#E6E2D7" stroke-width="2"/><text x="340" y="336" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">Cloudy or cold</text><text x="560" y="336" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">4 drops</text><text x="680" y="336" font-size="24" font-weight="700" fill="#1F1E1C" text-anchor="start">16 drops</text><line x1="340" y1="352" x2="790" y2="352" stroke="#E6E2D7" stroke-width="2"/><text x="340" y="412" font-size="26" font-weight="700" fill="#1F1E1C" text-anchor="start">Stir, cover, wait</text><text x="560" y="412" font-size="40" font-weight="800" fill="#C2402C" text-anchor="start">30 min</text><text x="340" y="456" font-size="20" font-weight="600" fill="#6E6A60" text-anchor="start">It should smell slightly of chlorine.</text><text x="340" y="480" font-size="20" font-weight="600" fill="#6E6A60" text-anchor="start">Filter cloudy water through a cloth first.</text><text x="340" y="524" font-size="18" font-weight="600" fill="#6E6A60" text-anchor="start">1 US gallon: 8 drops of 6%, or 6 drops of 8.25%</text></svg>