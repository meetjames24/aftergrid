source /boot/grub/config.cfg
set timeout=8

menuentry "Aftergrid  -  Encrypted persistence (your settings + logins)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks
	initrd	@INITRD_LIVE@
}
menuentry "Aftergrid  -  Fresh session (nothing saved)" --hotkey=f {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}
menuentry "Aftergrid  -  Ελληνικά (Greek, encrypted persistence)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=el_GR.UTF-8 keyboard-layouts=gr,us
	initrd	@INITRD_LIVE@
}
menuentry "Aftergrid  -  Load to RAM (pull the stick after boot)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks toram
	initrd	@INITRD_LIVE@
}
menuentry "Aftergrid  -  Safe graphics (black screen fix)" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks nomodeset
	initrd	@INITRD_LIVE@
}

submenu 'Language  -  Langue  -  Sprache  -  Idioma  -  Dil...' --hotkey=l {
	source /boot/grub/theme.cfg
	menuentry "English" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=en_US.UTF-8 keyboard-layouts=us,gr
		initrd	@INITRD_LIVE@
	}
	menuentry "Ελληνικά (Greek)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=el_GR.UTF-8 keyboard-layouts=gr,us
		initrd	@INITRD_LIVE@
	}
	menuentry "Français (French)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=fr_FR.UTF-8 keyboard-layouts=fr,us
		initrd	@INITRD_LIVE@
	}
	menuentry "Deutsch (German)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=de_DE.UTF-8 keyboard-layouts=de,us
		initrd	@INITRD_LIVE@
	}
	menuentry "Português do Brasil" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=pt_BR.UTF-8 keyboard-layouts=br,us
		initrd	@INITRD_LIVE@
	}
	menuentry "Português (Portugal)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=pt_PT.UTF-8 keyboard-layouts=pt,us
		initrd	@INITRD_LIVE@
	}
	menuentry "Türkçe (Turkish)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence persistence-encryption=luks locales=tr_TR.UTF-8 keyboard-layouts=tr,us
		initrd	@INITRD_LIVE@
	}
}

submenu 'Utilities...' --hotkey=u {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=b {
			fwsetup
		}
	fi
	menuentry "Persistence WITHOUT encryption (legacy)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
		initrd	@INITRD_LIVE@
	}
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
