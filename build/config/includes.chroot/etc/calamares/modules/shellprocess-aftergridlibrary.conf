# Aftergrid: copy the offline library (books, maps, manuals, AI model) from the USB onto the installed system.
dontChroot: true
timeout: 3600
script:
  - "-mkdir -p ${ROOT}/opt/aftergrid-library"
  - "-cp -a /run/live/medium/aftergrid-library/. ${ROOT}/opt/aftergrid-library/"
i18n:
  name: "Copying the Aftergrid offline library"
