# Aftergrid Field Mode portal. Answers only this machine and Aftergrid hotspot clients (10.42.x.x).
server.modules = ("mod_access", "mod_alias", "mod_redirect", "mod_proxy", "mod_setenv")
# Stream proxied responses (the offline AI answers word by word) instead of buffering them whole.
server.stream-response-body = 2
server.document-root = "/usr/share/aftergrid/portal"
server.port          = 80
server.username      = "www-data"
server.groupname     = "www-data"
server.pid-file      = "/run/lighttpd.pid"
server.errorlog      = "/var/log/lighttpd/error.log"
index-file.names     = ("index.html")
server.follow-symlink = "enable"
include_shell "/usr/share/lighttpd/create-mime.conf.pl"
mimetype.assign += (".pmtiles" => "application/octet-stream", ".pbf" => "application/x-protobuf")

$HTTP["remoteip"] !~ "^(127\.|10\.42\.|::1$)" { url.access-deny = ("") }

# Hotspot clients asking for any other site land on the portal (captive portal).
$HTTP["remoteip"] =~ "^10\.42\." {
  $HTTP["host"] !~ "^(10\.42\.0\.1|aftergrid\.local)(:80)?$" { url.redirect = ("^/(.*)" => "http://10.42.0.1/") }
}

alias.url = (
  "/index.json"           => "/run/aftergrid/index.json",
  "/files/baked/"         => "/run/live/medium/aftergrid-library/",
  "/files/opt/"           => "/opt/aftergrid-library/",
  "/files/vault/maps/"    => "/vault/maps/",
  "/files/vault/library/" => "/vault/library/",
)
$HTTP["url"] =~ "^/files/.*/(models|overlay)/" { url.access-deny = ("") }
$HTTP["url"] =~ "^/index.json" { setenv.add-response-header = ("Cache-Control" => "no-store") }

$HTTP["url"] =~ "^/kiwix" { proxy.server = ("" => (("host" => "127.0.0.1", "port" => 8080))) }
$HTTP["url"] =~ "^/ai/" {
  proxy.server = ("" => (("host" => "127.0.0.1", "port" => 8081)))
  proxy.header = ("map-urlpath" => ("/ai/" => "/"))
}
# Meaning-based search over the first-aid cards and manuals (aftergrid-semantic)
$HTTP["url"] =~ "^/sem/" {
  proxy.server = ("" => (("host" => "127.0.0.1", "port" => 8083)))
  proxy.header = ("map-urlpath" => ("/sem/" => "/"))
}
