<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aftergrid Field Mode</title><link rel="stylesheet" href="/aftergrid.css"></head><body>
<main>
  <div class="grid" id="tiles"></div>
  <h2 data-t>On this Aftergrid</h2>
  <div id="stats" class="note" data-t>Loading library…</div>
</main>
<script src="/aftergrid-i18n.js"></script><script src="/aftergrid.js"></script>
<script>
const TILES = [
  ['medical','✚','Medical','First aid, WikiMed, field surgery'],
  ['water','💧','Water','Find, purify, store'],
  ['food','🥫','Food','Preserve, cook, grow'],
  ['shelter','⛺','Shelter & Survival','Disaster, fallout, knots'],
  ['repair','🔧','Repair & Build','Tools, solar, appropriate tech'],
  ['power','⚡','Power','Solar, batteries, generators'],
  ['maps.html','🗺','Maps','Offline street maps'],
  ['comms.html','📻','Comms','Radio frequencies & mesh'],
  ['ask.html','💬','Ask Aftergrid','Local AI, answers from the library'],
  ['library','📚','Everything','All books & manuals'],
  ['gobag.html','🎒','Go-Bag','Your emergency card & documents'],
];
Aftergrid.load().then(() => {
  Aftergrid.header('Field Mode');
  const g = document.getElementById('tiles');
  for (const [id, ico, t, s] of TILES) {
    const a = document.createElement('a'); a.className = 'tile';
    a.href = id.includes('.html') ? '/' + id : '/topic.html?t=' + id;
    a.innerHTML = `<div class="ico">${ico}</div><b>${Aftergrid.T(t)}</b><span>${Aftergrid.T(s)}</span>`;
    g.append(a);
  }
  const i = Aftergrid.index;
  document.getElementById('stats').textContent =
    `${Aftergrid.books.length} ${Aftergrid.T('libraries')} · ${(i.pdfs||[]).length} ${Aftergrid.T('manuals')} · ${(i.maps||[]).length} ${Aftergrid.T('map regions')} · ${Aftergrid.T(i.ai ? 'local AI ready' : 'local AI off')}` +
    (i.hotspot ? ` · ${Aftergrid.T('Hotspot ON: phones join Wi-Fi')} "${i.hotspot}" ${Aftergrid.T('and open')} http://10.42.0.1` : '');
});
</script></body></html>
