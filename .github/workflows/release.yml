# Push a tag like v1.1 -> builds Aftergrid USB Maker, signs it (when signing secrets are set),
# and publishes a GitHub Release. iso.yml builds the ISO on the same tag and attaches its parts +
# latest.json (or upload a local build with ./release.sh).
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build USB Maker (Mono, .NET 4.7 API)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q mono-mcs mono-devel
          A=/usr/lib/mono/4.7-api; cd flasher/usbmaker
          mcs -nostdlib -r:$A/mscorlib.dll -r:$A/System.dll -r:$A/System.Core.dll -r:$A/System.Windows.Forms.dll \
              -r:$A/System.Drawing.dll -r:$A/System.Management.dll -r:$A/System.Web.Extensions.dll \
              -r:$A/System.IO.Compression.dll -r:$A/System.IO.Compression.FileSystem.dll \
              -target:winexe -win32icon:aftergrid.ico -out:AftergridUSBMaker.exe AftergridUsbMaker.cs Packs.cs
          cp ../../build/config/includes.chroot/usr/share/aftergrid/catalog.json .
      - uses: actions/upload-artifact@v4
        with: { name: unsigned, path: "flasher/usbmaker/AftergridUSBMaker.exe\nflasher/usbmaker/catalog.json" }

  sign-and-release:
    needs: build
    runs-on: windows-latest
    env:
      CAN_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: unsigned, path: dist }
      # Azure Trusted Signing with the org-level secrets (same names as the org's other repos):
      #   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #   AZURE_CODE_SIGNING_ENDPOINT, AZURE_CODE_SIGNING_ACCOUNT_NAME, AZURE_CODE_SIGNING_PROFILE_NAME
      - name: Sign
        if: env.CAN_SIGN == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CODE_SIGNING_PROFILE_NAME }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify signature
        if: env.CAN_SIGN == 'true'
        shell: pwsh
        run: |
          $s = Get-AuthenticodeSignature dist/AftergridUSBMaker.exe
          $s | Format-List Status, SignerCertificate
          if ($s.Status -ne 'Valid') { throw "Signature not valid: $($s.Status)" }
      - name: Checksums
        shell: bash
        run: cd dist && sha256sum AftergridUSBMaker.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AftergridUSBMaker.exe
            dist/SHA256SUMS.txt
            dist/catalog.json
          body: |
            **Download `AftergridUSBMaker.exe` and run it.** It downloads Aftergrid, writes it to the USB stick you choose, checks every byte, and adds the packs you tick (Wikipedia, maps, offline AI, languages…).
            ${{ env.CAN_SIGN == 'true' && 'Signed installer.' || 'Note: this build is not code-signed yet; Windows may show "unknown publisher" (More info → Run anyway).' }}
